<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0e1417; color: #e9f1ee; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      -webkit-user-select: none; -webkit-app-region: drag; cursor: default;
    }
    .box { text-align: center; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 20px;
      background: #2dd4bf; box-shadow: 0 0 16px #2dd4bf;
      animation: pulse 1.4s ease-in-out infinite;
    }
    h1 { font-size: 19px; letter-spacing: 0.24em; margin: 0 0 10px; font-weight: 700; }
    p { font-size: 11.5px; color: #8aa19b; letter-spacing: 0.08em; margin: 0; }
    .dots { display: inline-block; width: 14px; text-align: left; animation: blink 1.2s steps(1) infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>LA OFICINA</h1>
    <p>Preparando la oficina<span class="dots">…</span></p>
  </div>
</body>
</html>
