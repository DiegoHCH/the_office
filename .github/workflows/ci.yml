# CI de La Oficina:
# - checks: en cada push/PR — sintaxis de main/preload, build del renderer y
#   smoke test de Electron (el harness que habría atrapado la pantalla negra
#   de la v1.3.0: arranca la app y busca errores de runtime en la consola).
# - release: al pushear un tag v* — construye el DMG y lo sube al release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sintaxis del main process
        run: node --check electron/main.js && node --check electron/preload.js
      # Encontró de entrada un crash real: Vector3 sin importar en Office.jsx,
      # que tumbaba la escena con el modo director encendido (#126). El smoke
      # test no lo veía porque arranca con esa preferencia apagada.
      - name: Lint
        run: npm run lint
      - name: Tests del núcleo (ruteo y helpers)
        run: npm test
      # la guía en inglés se genera del español; si alguien la edita a mano o
      # toca el original sin traducir, aquí se ve (#118)
      - name: Guía en inglés al día
        run: npm run guia:check
      - name: Build del renderer
        run: npx vite build
      # El runner corre con GL por software y a veces el proceso GPU se cae a
      # media ejecución; three.js encadena TypeErrors sobre el contexto perdido
      # y el grep los tomaba por errores del código (#127). Ahora el log se
      # corta en la caída —lo anterior sí cuenta— y esa corrida se reintenta.
      - name: Smoke test del renderer
        run: |
          # solo la caída de verdad: «Context Lost» a secas también lo emite el
          # cierre normal con kill, y tomarlo por crash haría reintentar siempre
          GPU_MUERTA='GPU process exited unexpectedly|Restarting GPU process due to unrecoverable error'
          for intento in 1 2; do
            ELECTRON_ENABLE_LOGGING=1 npx electron . > electron-log.txt 2>&1 &
            EPID=$!
            sleep 20
            kill $EPID 2>/dev/null || true
            # solo se analiza lo ocurrido ANTES de perder la GPU
            sed -E "/$GPU_MUERTA/q" electron-log.txt > analizable.txt
            if grep -qiE "uncaught|TypeError|ReferenceError" analizable.txt; then
              echo "::error::Errores de runtime en el renderer"
              cat analizable.txt
              exit 1
            fi
            if grep -qE "$GPU_MUERTA" electron-log.txt; then
              echo "GPU del runner caída en el intento $intento — sin errores hasta ese punto"
              [ "$intento" = 2 ] && { echo "::warning::smoke inconcluso: la GPU se cayó dos veces"; break; }
              continue
            fi
            echo "Renderer sin errores ✓"
            break
          done

  # El release se publica en DOS pasos a propósito. Notarizar puede tardar horas
  # —y alguna vez no responder—, y encadenar la publicación al build significaba
  # no tener versión hasta que Apple contestara. Ahora la página del release
  # existe desde el primer minuto y los binarios aterrizan cuando estén.
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Las notas se escriben en el repo, en docs/releases/<tag>.md, y viajan en
      # el mismo commit que sube la versión. Antes solo se respetaban si el
      # release YA existía —creado a mano— y al publicar por tag nunca existe:
      # el resultado eran seis versiones seguidas con la lista de commits por
      # toda nota. Es información que hay que escribir cuando la tienes fresca,
      # no reconstruir después leyendo el historial.
      - name: Crear el release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="docs/releases/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "ya existe, se respetan sus notas"
          elif [ -f "$NOTAS" ]; then
            gh release create "$GITHUB_REF_NAME" --title "La Oficina $GITHUB_REF_NAME" --notes-file "$NOTAS"
          else
            gh release create "$GITHUB_REF_NAME" --title "La Oficina $GITHUB_REF_NAME" --generate-notes
            echo "::warning::Sin $NOTAS — las notas salen autogeneradas (la lista de commits)"
          fi
      # Re-pushear un tag degrada su release a borrador, y publicar uno viejo lo
      # marca «latest» (GitHub ordena por fecha, no por versión). Como el aviso
      # de versión nueva de la app consulta /releases/latest, un descuido aquí
      # deja el release invisible o le ofrece al usuario BAJAR de versión.
      - name: Publicarlo y marcarlo como latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  binarios:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publicar
    runs-on: macos-14
    # Apple normalmente tarda minutos, pero ha llegado a dejar envíos colgados
    # días. Sin tope, el job se comería las 6 h del default para nada.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Firma con Developer ID y notarización. Sin los secrets, el build sigue
      # saliendo (sin firmar, como hasta ahora) en vez de romper el release.
      - name: Construir DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --publish never: electron-builder intenta auto-publicar al ver el tag;
        # de subir el asset se encarga el paso siguiente con gh
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::Sin certificado: el DMG saldrá sin firmar y no se publicará"
            # Un secret que no existe llega como cadena vacía, no ausente, y
            # electron-builder trata CSC_LINK definido como ruta al .p12: la
            # resuelve contra el cwd y muere con «not a file». Hay que quitarla.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "firmado=no" >> "$GITHUB_ENV"
          else
            echo "firmado=si" >> "$GITHUB_ENV"
          fi
          # Mismo motivo: con las credenciales en blanco intentaría notarizar y
          # se llevaría un 401 en vez de saltarse el paso.
          if [ -z "$APPLE_ID" ]; then
            echo "::warning::Sin credenciales de notarización: el DMG saldrá sin ticket"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist:mac -- --publish never

      - name: Verificar firma y notarización
        run: |
          APP="release/mac-arm64/La Oficina.app"
          [ -d "$APP" ] || APP="release/mac/La Oficina.app"
          echo "— firma —"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          echo "— gatekeeper —"
          spctl -a -vvv -t install "$APP" 2>&1 || echo "sin notarizar (esperado si no hay secrets)"
          echo "— ticket de notarización —"
          xcrun stapler validate "$APP" 2>&1 || echo "sin ticket"

      # El auto-update necesita los TRES: el zip es lo que instala electron-updater
      # en macOS —no puede autoinstalar desde un DMG—, latest-mac.yml es cómo se
      # entera de que hay versión nueva, y el DMG es lo que descarga quien
      # instala a mano por primera vez. Si falta el yml, la app se cae al aviso.
      # --clobber pisa el asset que ya esté subido. Desde que la app se firma,
      # un DMG sin firmar es peor que ninguno: reemplazaría uno bueno subido a
      # mano por otro que macOS pone en cuarentena. Así que sin certificado no
      # se publica binario y el aviso dice de dónde tiene que salir.
      - name: Subir DMG al release del tag
        if: env.firmado == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `release/*.zip` y no `*-mac.zip`: al quitar el espacio del nombre del
          # artefacto (para que el manifiesto y GitHub coincidan) el zip perdió
          # el sufijo `-mac` y este patrón dejó de encontrarlo. El build entero
          # —firma y notarización incluidas— terminaba bien y solo fallaba aquí.
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/latest-mac.yml --clobber ||
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/latest-mac.yml \
              --title "La Oficina $GITHUB_REF_NAME" --generate-notes
      - name: Avisar que el binario hay que subirlo a mano
        if: env.firmado == 'no'
        run: |
          echo "::warning::No se subió DMG: sin certificado saldría sin firmar. \
          Genéralo en una máquina con el Developer ID (npm run dist:mac) y súbelo \
          con gh release upload $GITHUB_REF_NAME release/*.dmg --clobber"

      # De publicarlo y marcarlo «latest» ya se encargó el job anterior: aquí solo
      # se comprueba que lo que verá la app instalada es lo que esperamos.
      - name: Verificar lo que verá el checker de la app
        if: env.firmado == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName)
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          echo "latest=$LATEST · assets de $GITHUB_REF_NAME=$ASSETS"
          [ "$LATEST" = "$GITHUB_REF_NAME" ] || { echo "::error::latest es $LATEST, no $GITHUB_REF_NAME"; exit 1; }
          # tres: dmg (instalación a mano), zip y latest-mac.yml (auto-update).
          # Con menos, la app no se entera de que hay versión nueva.
          [ "$ASSETS" -ge 3 ] || { echo "::error::faltan artefactos: hay $ASSETS de 3"; exit 1; }
          # Y que cada archivo que nombra el manifiesto EXISTA de verdad en el
          # release. Contar tres no basta: la v1.15.0 salió con sus tres
          # artefactos y la actualización automática rota igual, porque
          # `latest-mac.yml` apuntaba a un nombre que GitHub había cambiado al
          # subirlo (los espacios se convierten en puntos). La app pedía una URL
          # que devolvía 404, y eso no se ve mirando la lista de assets.
          NOMBRES=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for URL in $(grep -oE '^  - url: .+$' release/latest-mac.yml | sed 's/^  - url: //'); do
            echo "$NOMBRES" | grep -qx "$URL" || {
              echo "::error::latest-mac.yml apunta a '$URL' y ese asset no existe en el release"
              echo "assets: $NOMBRES"
              exit 1
            }
          done
          echo "✓ los archivos del manifiesto existen en el release"
