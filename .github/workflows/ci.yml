# CI de La Oficina:
# - checks: en cada push/PR — sintaxis de main/preload, build del renderer y
#   smoke test de Electron (el harness que habría atrapado la pantalla negra
#   de la v1.3.0: arranca la app y busca errores de runtime en la consola).
# - release: al pushear un tag v* — construye el DMG y lo sube al release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sintaxis del main process
        run: node --check electron/main.js && node --check electron/preload.js
      # Encontró de entrada un crash real: Vector3 sin importar en Office.jsx,
      # que tumbaba la escena con el modo director encendido (#126). El smoke
      # test no lo veía porque arranca con esa preferencia apagada.
      - name: Lint
        run: npm run lint
      - name: Tests del núcleo (ruteo y helpers)
        run: npm test
      - name: Build del renderer
        run: npx vite build
      # El runner corre con GL por software y a veces el proceso GPU se cae a
      # media ejecución; three.js encadena TypeErrors sobre el contexto perdido
      # y el grep los tomaba por errores del código (#127). Ahora el log se
      # corta en la caída —lo anterior sí cuenta— y esa corrida se reintenta.
      - name: Smoke test del renderer
        run: |
          # solo la caída de verdad: «Context Lost» a secas también lo emite el
          # cierre normal con kill, y tomarlo por crash haría reintentar siempre
          GPU_MUERTA='GPU process exited unexpectedly|Restarting GPU process due to unrecoverable error'
          for intento in 1 2; do
            ELECTRON_ENABLE_LOGGING=1 npx electron . > electron-log.txt 2>&1 &
            EPID=$!
            sleep 20
            kill $EPID 2>/dev/null || true
            # solo se analiza lo ocurrido ANTES de perder la GPU
            sed -E "/$GPU_MUERTA/q" electron-log.txt > analizable.txt
            if grep -qiE "uncaught|TypeError|ReferenceError" analizable.txt; then
              echo "::error::Errores de runtime en el renderer"
              cat analizable.txt
              exit 1
            fi
            if grep -qE "$GPU_MUERTA" electron-log.txt; then
              echo "GPU del runner caída en el intento $intento — sin errores hasta ese punto"
              [ "$intento" = 2 ] && { echo "::warning::smoke inconcluso: la GPU se cayó dos veces"; break; }
              continue
            fi
            echo "Renderer sin errores ✓"
            break
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Construir DMG
        # --publish never: electron-builder intenta auto-publicar al ver el tag;
        # de subir el asset se encarga el paso siguiente con gh
        run: npm run dist:mac -- --publish never
      - name: Subir DMG al release del tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber ||
            gh release create "$GITHUB_REF_NAME" release/*.dmg \
              --title "La Oficina $GITHUB_REF_NAME" --generate-notes
      # Re-pushear un tag degrada su release a borrador, y publicar uno viejo lo
      # marca «latest» (GitHub ordena por fecha, no por versión). Como el aviso
      # de versión nueva de la app consulta /releases/latest, un descuido aquí
      # deja el release invisible o le ofrece al usuario BAJAR de versión.
      - name: Publicar el release y marcarlo como latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Verificar lo que verá el checker de la app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName)
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          echo "latest=$LATEST · assets de $GITHUB_REF_NAME=$ASSETS"
          [ "$LATEST" = "$GITHUB_REF_NAME" ] || { echo "::error::latest es $LATEST, no $GITHUB_REF_NAME"; exit 1; }
          [ "$ASSETS" -ge 1 ] || { echo "::error::el release no tiene DMG"; exit 1; }
